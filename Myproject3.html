<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interest Calculator</title>

    <link rel="stylesheet" href="./css/Myproject3.css">
</head>

<body>

    <div class="box">

        <h1>Interest Calculator</h1>

        <label>Interest Type</label>
        <select id="choice">
            <option value="1">Simple Interest</option>
            <option value="2">Compound Interest</option>
        </select>


        <label>Principal</label>
        <input type="number" id="principal"
               placeholder="Enter Principal">


        <label>Rate (%)</label>
        <input type="number" id="rate"
               placeholder="Enter Rate">


        <label>Duration (Years)</label>
        <input type="number" id="duration"
               placeholder="Enter Duration">


        <button onclick="calculateInterest()">
            Calculate
        </button>

        <button onclick="clearResult()">
            Clear
        </button>

        <div id="result"></div>

    </div>


    <script src="./Javascript/Myproject3.js"></script>

</body>
</html>
